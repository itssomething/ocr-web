<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vietnamese OCR</title>
  </head>
  <body>
    <main class="app">
      <header>
        <h1>Vietnamese OCR</h1>
        <p class="subtitle">Extract text from scans and screenshots. Everything runs in your browser — images are never uploaded.</p>
      </header>

      <label id="drop-zone" class="drop-zone" tabindex="0">
        <input id="file-input" type="file" accept="image/*" multiple hidden />
        <span>Drop images here, click to choose several, or paste with <kbd>⌘</kbd>/<kbd>Ctrl</kbd>+<kbd>V</kbd></span>
      </label>

      <div id="status" class="status" hidden>
        <div class="status-row">
          <span id="status-text"></span>
          <span id="status-percent"></span>
        </div>
        <progress id="progress" max="1" value="0"></progress>
      </div>

      <section class="results">
        <div class="results-header">
          <h2>Results <span id="result-count" class="count"></span></h2>
          <div class="actions">
            <button id="copy-all-button" type="button" disabled>Copy all</button>
            <button id="download-button" type="button" disabled>Download .txt</button>
            <button id="clear-button" type="button" disabled>Clear</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th class="col-index">#</th>
                <th class="col-image">Image</th>
                <th>File</th>
                <th class="col-status">Status</th>
                <th>Text</th>
              </tr>
            </thead>
            <tbody id="results-body">
              <tr class="empty-row">
                <td colspan="5">No images yet</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
