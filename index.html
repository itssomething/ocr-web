<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vietnamese OCR</title>
  </head>
  <body>
    <main class="app">
      <header>
        <h1>Vietnamese OCR</h1>
        <p class="subtitle">Extract text from scans and screenshots. Everything runs in your browser — images are never uploaded.</p>
      </header>

      <label id="drop-zone" class="drop-zone" tabindex="0">
        <input id="file-input" type="file" accept="image/*" multiple hidden />
        <span>Drop images here, click to choose several, or paste with <kbd>⌘</kbd>/<kbd>Ctrl</kbd>+<kbd>V</kbd></span>
      </label>

      <div id="status" class="status" hidden>
        <div class="status-row">
          <span id="status-text"></span>
          <span id="status-percent"></span>
        </div>
        <progress id="progress" max="1" value="0"></progress>
      </div>

      <section class="results">
        <div class="results-header">
          <h2>Results <span id="result-count" class="count"></span></h2>
          <div class="actions">
            <button id="copy-all-button" type="button" disabled>Copy all</button>
            <button id="download-button" type="button" disabled>Download .txt</button>
            <button id="clear-button" type="button" disabled>Clear</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th class="col-index">#</th>
                <th class="col-image">Image</th>
                <th>File</th>
                <th class="col-status">Status</th>
                <th>Text</th>
              </tr>
            </thead>
            <tbody id="results-body">
              <tr class="empty-row">
                <td colspan="5">No images yet</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <dialog id="compare-dialog" class="compare-dialog" aria-labelledby="compare-title">
      <div class="compare-header">
        <h2 id="compare-title"></h2>
        <div class="actions">
          <button id="compare-prev" type="button" aria-label="Previous image">← Prev</button>
          <button id="compare-next" type="button" aria-label="Next image">Next →</button>
          <button id="compare-close" type="button" aria-label="Close">✕</button>
        </div>
      </div>
      <div class="compare-body">
        <section class="compare-pane">
          <div class="pane-toolbar">
            <span>Image</span>
            <div class="actions">
              <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
              <button id="zoom-fit" type="button" title="Fit to pane width">Fit width</button>
              <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
            </div>
          </div>
          <div id="compare-image-wrap" class="compare-image-wrap">
            <img id="compare-image" alt="" />
          </div>
        </section>
        <section class="compare-pane">
          <div class="pane-toolbar">
            <span>Text <small>(editable — changes update the table)</small></span>
            <button id="compare-copy" type="button">Copy</button>
          </div>
          <textarea id="compare-text" spellcheck="false"></textarea>
        </section>
      </div>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
